name: Build Attestor RPM
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, fedora39]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a matching version tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Run this workflow on a v* tag" >&2; exit 1 ;;
          esac
          version="${GITHUB_REF#refs/tags/v}"
          package_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -n 1)
          test "$package_version" = "$version"
      - name: Native prerequisites
        run: sudo dnf install -y @development-tools openssl-devel pkgconfig tss2-devel tpm2-tss-devel rpm-build perl python3
      - name: Build and test
        run: |
          cargo test --locked --manifest-path server/Cargo.toml
          cargo build --locked --release --manifest-path server/Cargo.toml
          python3 -m unittest discover -s server/tests -v
          python3 -m unittest discover -s tests -v
      - name: Package RPM with notices
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} package
          cp LICENSE THIRD_PARTY_NOTICES.md rpmbuild/SOURCES/
          cp server/target/release/attestor-server rpmbuild/SOURCES/
          target=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --locked --format-version 1 --filter-platform "$target" --manifest-path server/Cargo.toml > "$RUNNER_TEMP/attestor-metadata.json"
          python3 scripts/collect_licenses.py "$RUNNER_TEMP/attestor-metadata.json" rpmbuild/SOURCES/attestor-server-third-party-licenses.tar.gz
          cp server/specs/attestor-server.spec rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version: $version/" rpmbuild/SPECS/attestor-server.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/attestor-server.spec
          cp rpmbuild/RPMS/x86_64/attestor-server-"$version"-1*.rpm package/attestor-server-"$version".rpm
          sha256sum package/attestor-server-"$version".rpm > package/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: attestor-rpm
          path: package/
